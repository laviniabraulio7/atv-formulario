<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Escola de Programação</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        background-color: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 30px;
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
    }

    body > p {
        text-align: center;
        color: #bbb;
        margin-bottom: 30px;
    }

    form {
        background-color: #1c1c1c;
        padding: 25px;
        max-width: 750px;
        margin: 0 auto;
        border-radius: 8px;
    }

    fieldset {
        border: 1px solid #444;
        margin-bottom: 20px;
        padding: 20px;
        border-radius: 6px;
    }

    legend {
        font-weight: bold;
        padding: 0 8px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        margin-top: 12px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
        width: 100%;
        background-color: #292929;
        color: #eee;
        border: 1px solid #555;
        padding: 10px;
        border-radius: 4px;
    }

    input::placeholder,
    textarea::placeholder {
        color: #999;
    }

    textarea {
        resize: vertical;
    }

    p {
        margin-bottom: 8px;
    }

    /* Radio e checkbox */
    .opcao {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
    }

    .opcao input {
        margin: 0;
    }

    .opcao label {
        margin: 0;
    }

    h2 {
        margin-top: 0;
        font-size: 20px;
    }

    button {
        padding: 10px 22px;
        margin-right: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }

    button[type="submit"] {
        background-color: #eee;
        color: #111;
    }

    button[type="reset"] {
        background-color: #444;
        color: #eee;
    }

    button:hover {
        opacity: 0.85;
    }
</style>

</head>
<body>

    <h1>Escola de Programação</h1>
    <p>Formulário de Inscrição para novos alunos</p>

    <form action="#" method="post">

    <fieldset>
       
        <legend>Dados pessoais</legend>
        <label for="nome">Nome:</label>

        <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Digite seu nome"
        required
        >

        <label for="sobrenome">Sobrenome:</label>

        <input
        type="text"
        id="sobrenome"
        name="sobrenome"
        placeholder="Digite seu sobrenome"
        required
        >
        <br><br>

        <label for="email">E-mail:</label>
        <input
        type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail"
        required
        >

        <br><br>

        <label for="senha">Senha:</label>
        
        <input
        type="password"
        id="senha"
        name="senha"
        placeholder="Mínimo de 8 caracteres"
        minlength="8"
        required
        >

        <br><br>

        <label for="Telefone">Telefone:</label>

        <input
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="(00) 00000-0000"
        required
        >

        <br><br>

        <label for="Idade">Idade:</label>

        <input
        type="number"
        id="idade"
        name="idade"
        min="14"
        max="100"
        required
        >

        <br><br>

        <label for="Data de nascimento">Data de nascimento:</label>

        <input
        type="date"
        id="nascimento"
        name="nascimento"
        required
        >

    </fieldset>
    
    <fieldset>
        <legend>Informações do curso</legend>
        <br> 

        <label for="curso">Escolha o curso</label>

        <select id="curso" name="curso" required>
            <option value="">Selecione um curso</option>
            <option value="html-css">HTML e CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="banco-dados">Banco de Dados</option>
        </select>

        <br><br>

        <p>Modalidade:</p>

        <div class="opcao">
            <input type="radio" id="presencial" name="modalidade" value="presencial" required>
            <label for="presencial">Presencial</label>
        </div>

        <div class="opcao">
            <input type="radio" id="online" name="modalidade" value="online">
            <label for="online">Online</label>
        </div>


        <br><br>

        <p>Turno:</p>

        <div class="opcao">
            <input type="radio" id="manha" name="turno" value="manha" required>
            <label for="manha">Manhã</label>
        </div>

        <div class="opcao">
            <input type="radio" id="tarde" name="turno" value="tarde">
            <label for="tarde">Tarde</label>
        </div>

        <div class="opcao">
            <input type="radio" id="noite" name="turno" value="noite">
            <label for="noite">Noite</label>
        </div>

        <br><br>

        <label for="nivel"> Nivel:</label>

        <select id="nivel" name="nivel" required>
            <option value="">Selecione seu nível</option>
            <option value="iniciante">Iniciante</option>
            <option value="intermediario">Intermediário</option>
            <option value="avancado">Avançado</option>
        </select>

        <br><br>
        <label for="Quais tecnologias você já conhece?"
        >Quais tecnologias você já conhece?</label>

        <p>Quais tecnologias você já conhece?</p>

        <div class="opcao">
            <input type="checkbox" id="html" name="tecnologias" value="html">
            <label for="html">HTML</label>
        </div>

        <div class="opcao">
            <input type="checkbox" id="css" name="tecnologias" value="css">
            <label for="css">CSS</label>
        </div>

        <div class="opcao">
            <input type="checkbox" id="javascript" name="tecnologias" value="javascript">
            <label for="javascript">JavaScript</label>
        </div>

        <div class="opcao">
            <input type="checkbox" id="python" name="tecnologias" value="python">
            <label for="python">Python</label>
        </div>

        <div class="opcao">
            <input type="checkbox" id="java" name="tecnologias" value="java">
            <label for="java">Java</label>
        </div>

        <div class="opcao">
            <input type="checkbox" id="csharp" name="tecnologias" value="csharp">
            <label for="csharp">C#</label>
        </div>

    </fieldset>

    <fieldset>
        <legend>Informações adicionais</legend>

        <h2>Localização</h2>

        <label for="estado">Estado:</label>
        <select id="estado" name="estado" required>
            <option value="">Selecione seu estado</option>
            <option value="sp">São Paulo</option>
            <option value="mg">Minas Gerais</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="pr">Paraná</option>
            <option value="ba">Bahia</option>
        </select>

        <br><br>

        <label for="cidade">Cidade:</label>

        <input
        type="text"
        id="cidade"
        name="cidade"
        placeholder="Digite sua cidade"
        minlength="2"
        required
        >

        <br><br>

        <label for="motivo">Por que você deseja fazer esse curso?</label>
        
        <textarea
            id="motivo"
            name="motivo"
            placeholder="Conte por que deseja fazer o curso..."
            rows="6"
            minlength="20"
            required
        ></textarea>

        <br><br>
        <input
            type="checkbox"
            id="termos"
            name="termos"
            value="aceito"
            required
        >

        <label for="termos">Aceito os termos de inscrição</label>

    </fieldset>

    <fieldset>
        
        
        <legend>Finalização</legend>
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>


    </fieldset>
    </form>

    
</body>
</html>
